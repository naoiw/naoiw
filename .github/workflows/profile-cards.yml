name: Update GitHub Profile Cards

on:
  # Update the two displayed language cards daily at 09:52 JST (00:52 UTC).
  schedule:
    - cron: '52 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-cards-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v7

      - name: Generate language cards
        uses: naoiw/github-profile-cards@v1.0.0
        with:
          username: naoiw
          top-n: '12'
          chart: donut
          theme: all
          output-dir: profile-card-output

      - name: Commit generated SVGs when changed
        shell: bash
        run: |
          set -euo pipefail
          git add profile-card-output/
          if git diff --cached --quiet; then
            echo 'No profile card changes'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: update GitHub language profile cards'
          git push
