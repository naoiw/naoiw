name: Deploy profile cards to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - index.html
      - profile-card-output/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:
  workflow_run:
    workflows: ["Update GitHub Profile Cards"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    # Scheduled card refreshes push with GITHUB_TOKEN and do not trigger
    # ordinary push-based Pages builds. workflow_run publishes their output.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Stage static site and profile card SVGs
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          for metric in repo commit; do
            test -s "profile-card-output/dark/languages-by-$metric.svg"
          done

          mkdir -p _site
          cp index.html _site/index.html
          cp -R profile-card-output _site/
          touch _site/.nojekyll

      - name: Upload GitHub Pages site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
