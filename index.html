<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="GitHub language profile cards for naoiw.">
  <title>naoiw | GitHub Profile Cards</title>
  <style>
    :root {
      color-scheme: dark;
      background: #0d1117;
      color: #e6edf3;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: clamp(16px, 4vw, 48px);
    }

    main {
      width: 100%;
      max-width: 780px;
      margin: 0 auto;
      display: grid;
      gap: 20px;
    }

    a {
      display: block;
      border-radius: 12px;
    }

    a:focus-visible {
      outline: 2px solid #58c7f5;
      outline-offset: 4px;
    }

    img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 12px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="visually-hidden">naoiw GitHub Profile Cards</h1>
    <a href="https://github.com/naoiw/github-profile-cards" aria-label="Top Languages by Repo — GitHub Profile Cards">
      <img src="./profile-card-output/dark/languages-by-repo.svg" alt="Top Languages by Repo" width="780">
    </a>
    <a href="https://github.com/naoiw/github-profile-cards" aria-label="Top Languages by Commit — GitHub Profile Cards">
      <img src="./profile-card-output/dark/languages-by-commit.svg" alt="Top Languages by Commit" width="780">
    </a>
  </main>
</body>
</html>
